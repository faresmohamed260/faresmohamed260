    <g transform="translate(365 86)"><circle r="32" fill="#0a1b31" stroke="#4da3ff" stroke-width="2"/><text y="7" fill="#d7e7ff" font-size="20" font-weight="750">02</text><text y="70" fill="#fff" font-size="18" font-weight="700">Design</text><text y="94" fill="#7189a3" font-size="13">contracts + ownership</text></g>
    <g transform="translate(600 86)"><circle r="32" fill="#10172f" stroke="#727fff" stroke-width="2"/><text y="7" fill="#e1e2ff" font-size="20" font-weight="750">03</text><text y="70" fill="#fff" font-size="18" font-weight="700">Build</text><text y="94" fill="#7189a3" font-size="13">system + interfaces</text></g>
